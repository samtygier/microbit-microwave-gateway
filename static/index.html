<!DOCTYPE html>
<html lang="en">
 <head>
  <title>Micro:Wave control</title>
 </head>
 <body>
  <script type="module">
    import { call_wave, call_swave, call_run_pattern, call_set_config, gateway_status_check, run_provision, send_provision, send_control } from "./gateway.js";
    window.call_wave = call_wave;
    window.call_swave = call_swave;
    window.call_run_pattern = call_run_pattern;
    window.call_set_config = call_set_config;
    window.run_provision = run_provision;
    window.send_provision = send_provision;
    window.send_control = send_control;

    setTimeout(gateway_status_check, 1000)
    setInterval(gateway_status_check, 5_000);
  </script>
  <h1>Run</h1>
  <input id="form_wave_delay" type="number" value="1000"><br>

  <h2>Simple wave</h2>
  <input id="form_wave_row" type="text" value="A">
  <input id="form_wave_start" type="number" value="1">
  <input id="form_wave_stop" type="number" value="5"><br>
  <button type="button" onclick="call_wave()">Run</button>

  <h2>Straight wave</h2>
  <input id="form_swave_rstart" type="text" value="A">
  <input id="form_swave_rstop" type="text" value="J">
  <input id="form_swave_cstart" type="number" value="1">
  <input id="form_swave_cstop" type="number" value="26"><br>
  Start from
  <button type="button" onclick="call_swave('left')">Left</button>
  <button type="button" onclick="call_swave('right')">Right</button>
  <button type="button" onclick="call_swave('top')">Top</button>
  <button type="button" onclick="call_swave('bottom')">Bottom</button>

  <h2>Pattern</h2>
  Repeat: <input id="form_pattern_repeat" type="number" value="1">
  <button type="button" onclick="call_run_pattern()">Run</button>

  <h1>Config</h1>

  <h2>Tone settings</h2>
  <input id="form_config_volume" type="number" value="127" min="0" max="255">
  <button type="button" onclick="call_set_config('volume', 'form_config_volume')">Set Volume</button><br>

  <input id="form_config_pitch" type="number" value="1000" min="100" max="5000">
  <button type="button" onclick="call_set_config('pitch', 'form_config_pitch')">Set Pitch</button><br>

  <input id="form_config_length" type="number" value="200" min="0" max="2000">
  <button type="button" onclick="call_set_config('length', 'form_config_length')">Set Length</button><br>

  <input id="form_config_count" type="number" value="2" min="1" max="20">
  <button type="button" onclick="call_set_config('count', 'form_config_count')">Set Count</button><br>

  <h1>Provision</h1>

  Collect:
  <input id="form_prov_row" type="text" value="A" size="2">
  <input id="form_prov_col" type="number" value="1" min="1" max="50">
  <button type="button" onclick="run_provision()">Collect</button><br>

  Send:
  <input id="form_prov_only" type="text" value="A" size="5">
  <button type="button" onclick="send_provision()">Send</button><br>

  <textarea id="prov_log" name="" rows="5" cols="50"></textarea>

  <h1>Status</h1>
  <p>Gateway: <span id="status_gateway">...</span></p>
  <p>Pattern: <span id="status_pattern">...</span></p>
  <p>Microbits: <pre id="status_microbits">...</pre></p>

  <h1>Control</h1>
  <p><button type="button" onclick="send_control('R')">Reboot</button></p>
  <p><button type="button" onclick="send_control('H')">Heartbeat</button></p>

 </body>
</html>
